<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiki | روابط حساباتي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #4b382d;
    text-align: center;

    background-image:
        linear-gradient(rgba(245,225,205,0.45), rgba(245,225,205,0.45)),
        url("IMG-20260901-WA0007.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    width: 92%;
    max-width: 680px;
    margin: auto;
    padding: 35px 15px;
}

.avatar {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
    box-shadow: 0 5px 25px rgba(80,40,20,.35);
}

h1 {
    margin: 12px 0 5px;
    font-size: 34px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 30px;
}

.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;

    width: 100%;
    min-height: 82px;
    margin: 16px 0;
    padding: 12px 20px;

    background: rgba(255,255,255,.88);
    border: 2px solid #b99473;
    border-radius: 22px;

    text-decoration: none;
    color: #4b382d;

    transition: .2s;
}

.link:hover {
    transform: scale(1.02);
}

.link-name {
    direction: rtl;
    font-size: 21px;
    font-weight: bold;
}

.icon {
    width: 55px;
    height: 55px;
    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.icon svg {
    width: 32px;
    height: 32px;
}

.youtube {
    background: #ff0000;
}

.instagram {
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

.facebook {
    background: #1877f2;
}

.tiktok {
    background: #000;
}

footer {
    margin-top: 35px;
    font-size: 14px;
}
</style>
</head>

<div class="container">

<img class="avatar" src="IMG-20260901-WA0006.jpg">

<h1>Tiki</h1>

<div class="subtitle">روابط حساباتي</div>

href="https://youtube.com/@tikiworld-1?si=CSEfFuumvsdpc50y"
