<style>
* {

}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f1dfcf;
  color: #5b3925;
  text-align: center;

.container {
  width: 92%;
  max-width: 600px;
  margin: auto;
  padding: 25px 0 40px;
}

.avatar {
  width: 150px;
  height: 150px;

  text-decoration: none;
  color: #5b3925;
  background: rgba(255,255,255,.65);
  border: 2px solid #b88962;
  border-radius: 18px;
  padding: 14px 18px;
  margin: 14px 0;
  font-size: 19px;
  font-weight: bold;
  transition: .2s;
}

.link:hover {
  transform: scale(1.02);
}

.icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  color: white;

.youtube { background: #ff0000; }
.instagram { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
.facebook { background: #1877f2; }
