<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كاميرا وليد</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  display:flex;
  justify-content:center;
  align-items:center;
}
.container{
  width:90%;
  max-width:600px;
}
button{
  padding:15px 25px;
  border:0;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}
video{
  width:100%;
  margin-top:20px;
  border-radius:15px;
  background:#000;
}
</style>
</head>

<body>

<div class="container">
  <h1>كاميرا وليد</h1>
  <p>اضغط الزر للسماح باستخدام الكاميرا</p>

  <button onclick="startCamera()">تشغيل الكاميرا</button>

  <video id="camera" autoplay playsinline></video>
</div>

<script>
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    document.getElementById("camera").srcObject = stream;
  }catch(error){
    alert("لم يتم السماح باستخدام الكاميرا");
  }
}
</script>

</body>
</html>
