<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai-X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #24242c;
      background: #111116;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00e5ff;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .ai {
      align-self: flex-start;
      background: #181820;
      border: 1px solid #292933;
    }

    .user {
      align-self: flex-end;
      background: #006b78;
    }

    .input-area {
      padding: 12px;
      border-top: 1px solid #24242c;
      background: #111116;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1b1b23;
      color: white;
      font-size: 16px;
    }

    button {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #00e5ff;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Ai<span>-X</span></div>
  </header>

  <main id="chat">
    <div class="message ai">
      أهلاً بك في Ai-X 👋
      اكتب رسالتك بالأسفل للبدء.
    </div>
  </main>

  <div class="input-area">
    <input id="input" type="text" placeholder="اكتب رسالتك..." />
    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      chat.appendChild(userMessage);

      input.value = "";

      setTimeout(() => {
        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";
        aiMessage.textContent =
          "أنا Ai-X، وهذه حاليًا نسخة تجريبية. الخطوة القادمة سنربطني بذكاء اصطناعي حقيقي.";

        chat.appendChild(aiMessage);
        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
