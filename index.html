<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LinkGuard - فحص الروابط</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at top,#17220d 0,#080b0f 45%),
        #080b0f;
    color:#fff;
}

.container{
    width:92%;
    max-width:760px;
    margin:auto;
    padding:45px 0;
}

.header{
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#b8df3d;
}

.tagline{
    color:#9aa3ad;
    margin-top:12px;
    font-size:16px;
}

.scanner{
    margin-top:35px;
    padding:25px;
    background:rgba(17,22,29,.95);
    border:1px solid #27303a;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.label{
    display:block;
    margin-bottom:10px;
    color:#d7dce2;
    font-weight:bold;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    min-width:0;
    padding:17px;
    border-radius:13px;
    border:1px solid #303945;
    background:#080b0f;
    color:white;
    outline:none;
    font-size:16px;
    direction:ltr;
}

input:focus{
    border-color:#b8df3d;
}

button{
    border:0;
    border-radius:13px;
    padding:0 25px;
    background:#b8df3d;
    color:#101409;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.result{
    display:none;
    margin-top:22px;
    padding:22px;
    border-radius:17px;
    background:#0b1016;
    border:1px solid #29323d;
}

.result-title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}

.status{
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    font-weight:bold;
}

.info{
    padding:12px 0;
    border-bottom:1px solid #202731;
    word-break:break-all;
}

.green{
    color:#b8df3d;
}

.yellow{
    color:#ffd166;
}

.red{
    color:#ff6262;
}

.note{
    margin-top:18px;
    color:#7f8994;
    font-size:13px;
    line-height:1.7;
}

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.feature{
    background:#10151c;
    border:1px solid #242c35;
    border-radius:15px;
    padding:18px 12px;
    text-align:center;
}

.feature-icon{
    font-size:27px;
}

.feature-title{
    margin-top:9px;
    font-weight:bold;
}

.feature-text{
    color:#7f8994;
    font-size:12px;
    margin-top:6px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#555e68;
    font-size:12px;
}

@media(max-width:600px){

    .container{
        padding-top:30px;
    }

    .logo{
        font-size:31px;
    }

    .input-area{
        flex-direction:column;
    }

    input{
        width:100%;
    }

    button{
        height:52px;
    }

    .features{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Link<span>Guard</span>
        </div>

        <div class="tagline">
            افحص الرابط قبل أن تفتحه
        </div>

    </div>


    <div class="scanner">

        <label class="label">
            أدخل الرابط المراد فحصه
        </label>

        <div class="input-area">

            <input
                id="urlInput"
                type="text"
                placeholder="https://example.com"
                autocomplete="off"
            >

            <button onclick="scan()">
                فحص الرابط
            </button>

        </div>


        <div id="result" class="result"></div>

    </div>


    <div class="features">

        <div class="feature">
            <div class="feature-icon">🛡️</div>
            <div class="feature-title">
                تحليل أمني
            </div>
            <div class="feature-text">
                مؤشرات خطر للرابط
            </div>
        </div>

        <div class="feature">
            <div class="feature-icon">🔎</div>
            <div class="feature-title">
                تحليل النطاق
            </div>
            <div class="feature-text">
                معلومات عن عنوان الموقع
            </div>
        </div>

        <div class="feature">
            <div class="feature-icon">⚠️</div>
            <div class="feature-title">
                تحذيرات
            </div>
            <div class="feature-text">
                اكتشاف مؤشرات مشبوهة
            </div>
        </div>

    </div>


    <div class="footer">
        LinkGuard © 2026
    </div>

</div>


<script>

function scan(){

    const input =
        document.getElementById("urlInput");

    const result =
        document.getElementById("result");

    let value =
        input.value.trim();


    if(!value){

        showResult(
            "red",
            "أدخل رابطًا أولًا."
        );

        return;
    }


    if(!/^https?:\/\//i.test(value)){
        value = "https://" + value;
    }


    let url;

    try{

        url = new URL(value);

    }catch{

        showResult(
            "red",
            "الرابط غير صالح."
        );

        return;
    }


    const hostname =
        url.hostname.toLowerCase();


    let warnings = [];


    if(url.protocol !== "https:"){
        warnings.push(
            "الرابط لا يستخدم HTTPS."
        );
    }


    if(hostname.includes("xn--")){
        warnings.push(
            "النطاق يستخدم ترميزًا قد يخفي أحرفًا مشابهة."
        );
    }


    if(hostname.split(".").length > 4){
        warnings.push(
            "النطاق يحتوي على مستويات كثيرة."
        );
    }


    if(hostname.length > 60){
        warnings.push(
            "اسم النطاق طويل بشكل غير معتاد."
        );
    }


    if(warnings.length === 0){

        result.innerHTML = `

            <div class="result-title">
                الفحص المبدئي
            </div>

            <div class="status green">
                ✓ لم تظهر مؤشرات واضحة على الخطر
            </div>

            <div class="info">
                <strong>النطاق:</strong>
                ${escapeHtml(hostname)}
            </div>

            <div class="info">
                <strong>البروتوكول:</strong>
                ${escapeHtml(url.protocol)}
            </div>

            <div class="info">
                <strong>الرابط:</strong>
                ${escapeHtml(url.href)}
            </div>

            <div class="note">
                هذه نتيجة فحص مبدئي وليست ضمانًا بأن الرابط آمن.
                سيتم في المرحلة التالية ربط الموقع بمحرك فحص أمني حقيقي.
            </div>

        `;

    }else{

        result.innerHTML = `

            <div class="result-title">
                الفحص المبدئي
            </div>

            <div class="status yellow">
                ⚠️ توجد مؤشرات تحتاج إلى الحذر
            </div>

            <div class="info">
                <strong>النطاق:</strong>
                ${escapeHtml(hostname)}
            </div>

            <div class="info yellow">
                <strong>الملاحظات:</strong><br>
                ${warnings.map(
                    x => "• " + escapeHtml(x)
                ).join("<br>")}
            </div>

            <div class="note">
                لا تفتح الرابط إذا كنت لا تثق بمصدره.
                سيتم لاحقًا إضافة فحص متعدد المصادر.
            </div>

        `;
    }


    result.style.display = "block";
}


function showResult(type,text){

    const result =
        document.getElementById("result");

    result.style.display = "block";

    result.innerHTML =
        `<div class="status ${type}">
            ${text}
        </div>`;
}


function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


document
.getElementById("urlInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            scan();
        }

    }
);

</script>

</body>
</html>
