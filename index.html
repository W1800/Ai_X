<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    animation: flash 0.7s infinite;
}

@keyframes flash {
    0%, 85% {
        background: #000;
    }

    90% {
        background: #fff;
    }

    95% {
        background: #ddd;
    }

    100% {
        background: #000;
    }
}
</style>
</head>

<body>
</body>
</html>
