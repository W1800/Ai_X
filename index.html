<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نقل ملفات وليد</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.container{
  width:92%;
  max-width:650px;
  margin:25px auto;
}

.box{
  background:#1d1d1d;
  padding:20px;
  margin:15px 0;
  border-radius:18px;
}

button{
  padding:14px 22px;
  margin:8px;
  border:0;
  border-radius:12px;
  font-size:17px;
}

input[type="text"]{
  width:85%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:17px;
  text-align:center;
}

input[type="file"]{
  width:90%;
  margin:15px 0;
}

#myId{
  background:#000;
  padding:15px;
  border-radius:10px;
  color:#55ffae;
  font-size:19px;
  font-weight:bold;
  word-break:break-all;
}

#status{
  color:#55ffae;
  font-weight:bold;
}

.file{
  background:#292929;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  text-align:right;
}

.progress{
  width:100%;
  height:10px;
  background:#444;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.bar{
  height:100%;
  width:0%;
  background:#55ffae;
}
</style>

</head>

<body>

<div class="container">

<h1>📁 نقل ملفات وليد</h1>

<!-- التابلت -->

<div class="box">

<h2>📱 التابلت — إرسال الملفات</h2>

<p>رمز التابلت:</p>

<div id="myId">
جاري إنشاء الرمز...
</div>

<p>
أرسل هذا الرمز إلى S21 Ultra
</p>

<input
type="file"
id="files"
multiple
accept="image/*,video/*">

<br>

<button onclick="sendFiles()">
📤 إرسال الصور والفيديو
</button>

</div>


<!-- S21 Ultra -->

<div class="box">

<h2>📲 S21 Ultra — استقبال الملفات</h2>

<input
type="text"
id="remoteId"
placeholder="الصق رمز التابلت هنا">

<br>

<button onclick="connectToTablet()">
🔗 الاتصال بالتابلت
</button>

<div id="received"></div>

</div>


<p id="status">
الحالة: جاري الاتصال...
</p>

</div>


<script>

let peer = null;
let connection = null;


/* =========================
   إنشاء Peer
========================= */

function startPeer(){

  if(typeof Peer === "undefined"){

    document.getElementById("status").textContent =
    "❌ لم يتم تحميل نظام الاتصال";

    return;
  }


  peer = new Peer();


  peer.on("open", function(id){

    document.getElementById("myId").textContent =
    id;

    document.getElementById("status").textContent =
    "🟢 جاهز";

  });


  peer.on("error", function(error){

    console.log(error);

    document.getElementById("status").textContent =
    "❌ خطأ في الاتصال: " + error.type;

  });


  /*
    استقبال اتصال من S21 Ultra
  */

  peer.on("connection", function(conn){

    connection = conn;

    setupConnection(conn);

  });

}


/* =========================
   إعداد الاتصال
========================= */

function setupConnection(conn){

  conn.on("open", function(){

    document.getElementById("status").textContent =
    "🟢 الجهازان متصلان";

  });


  conn.on("data", function(data){

    receiveData(data);

  });


  conn.on("close", function(){

    document.getElementById("status").textContent =
    "🟠 تم إنهاء الاتصال";

  });


  conn.on("error", function(error){

    console.log(error);

    document.getElementById("status").textContent =
    "❌ حدث خطأ أثناء النقل";

  });

}


/* =========================
   اتصال S21 Ultra بالتابلت
========================= */

function connectToTablet(){

  const id =
  document.getElementById("remoteId").value.trim();


  if(!id){

    alert("اكتب رمز التابلت أولًا");

    return;
  }


  if(!peer){

    alert("انتظر حتى يظهر رمز جهازك");

    return;
  }


  document.getElementById("status").textContent =
  "🟡 جاري الاتصال بالتابلت...";


  connection =
  peer.connect(id, {
    reliable:true
  });


  setupConnection(connection);

}


/* =========================
   إرسال الملفات
========================= */

async function sendFiles(){

  if(!connection || !connection.open){

    alert("اتصل بالـS21 Ultra أولًا");

    return;
  }


  const files =
  document.getElementById("files").files;


  if(files.length === 0){

    alert("اختر صورًا أو فيديوهات أولًا");

    return;
  }


  for(const file of files){

    await sendFile(file);

  }


  document.getElementById("status").textContent =
  "🟢 تم إرسال جميع الملفات";

}


/* =========================
   إرسال ملف واحد
========================= */

function sendFile(file){

  return new Promise(async function(resolve){

    const chunkSize = 16 * 1024;

    const totalChunks =
    Math.ceil(file.size / chunkSize);


    connection.send({

      type:"start",

      name:file.name,

      size:file.size,

      mime:file.type,

      total:totalChunks

    });


    let offset = 0;
    let chunkNumber = 0;


    while(offset < file.size){

      const slice =
      file.slice(
        offset,
        offset + chunkSize
      );


      const buffer =
      await slice.arrayBuffer();


      connection.send({

        type:"chunk",

        number:chunkNumber,

        data:buffer

      });


      offset += chunkSize;

      chunkNumber++;


      const percent =
      Math.min(
        100,
        Math.round(
          (offset / file.size) * 100
        )
      );


      document.getElementById("status").textContent =
      "📤 إرسال " + file.name +
      " — " + percent + "%";


      /*
        نعطي الاتصال فرصة لمعالجة البيانات
      */

      await new Promise(
        r => setTimeout(r, 5)
      );

    }


    connection.send({

      type:"end"

    });


    resolve();

  });

}


/* =========================
   استقبال الملفات
========================= */

let incoming = null;


function receiveData(message){

  if(message.type === "start"){

    incoming = {

      name:message.name,

      size:message.size,

      mime:message.mime,

      total:message.total,

      chunks:[],

      received:0

    };


    document.getElementById("status").textContent =
    "📥 استقبال: " + message.name;


    return;
  }


  if(message.type === "chunk"){

    if(!incoming){
      return;
    }


    incoming.chunks[message.number] =
    message.data;


    incoming.received++;


    const percent =
    Math.round(
      (incoming.received /
      incoming.total) * 100
    );


    document.getElementById("status").textContent =
    "📥 استقبال " +
    incoming.name +
    " — " +
    percent +
    "%";


    return;
  }


  if(message.type === "end"){

    finishFile();

  }

}


/* =========================
   إنشاء الملف وتنزيله
========================= */

function finishFile(){

  if(!incoming){
    return;
  }


  const blob =
  new Blob(
    incoming.chunks,
    {
      type:incoming.mime
    }
  );


  const url =
  URL.createObjectURL(blob);


  const div =
  document.createElement("div");

  div.className =
  "file";


  div.innerHTML =
  "📁 " +
  incoming.name +
  "<br><br>" +
  "<a href='" +
  url +
  "' download='" +
  incoming.name +
  "'>" +
  "<button>⬇️ حفظ الملف</button>" +
  "</a>";


  document
  .getElementById("received")
  .appendChild(div);


  document.getElementById("status").textContent =
  "🟢 تم استلام " +
  incoming.name;


  incoming = null;

}


/* تشغيل النظام */

startPeer();

</script>

</body>
</html>
